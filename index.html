const titles = [
  "MEMBUAT JARINGAN PEER TO PEER",
  "Pengertian Peer to Peer",

];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function makeSlide(items, index) {
  const el = document.createElement('section');
  el.className = 'slide' + (index === 0 ? ' active cover' : '');
  const c = document.createElement('div');
  c.className = 'content';

  // Recreate the PPT content faithfully from extracted text,
  // while using a clean HTML presentation theme.
  const all = items.map(x => x.text).join('\n');
  const heading = index === 0 ? all.split('\n')[0] : (titles[index] || all.split('\n')[0]);

  let html = '';
  if (index === 0) {
    html += '<h1 class="title">' + esc(heading) + '</h1>';
    const rest = all.split('\n').slice(1).filter(Boolean);
    if (rest[0]) html += '<div class="subtitle">' + esc(rest[0]) + '</div>';
    if (rest.length > 1) {
      html += '<div class="meta" style="margin-top:28px">' + rest.slice(-4).map(esc).join('<br>') + '</div>';
    }
  } else {
    html += '<h2 class="section-title">' + esc(heading) + '</h2>';
    const content = items.filter(x => x.text !== heading);
    html += '<div class="body">';

    if (index === 4) {
      html += '<div class="topology">';
      html += '<div class="pc">KOMPUTER 1<br><span class="ip">192.168.1.1</span></div>';
      html += '<div class="cable"></div>';
      html += '<div class="pc">KOMPUTER 2<br><span class="ip">192.168.1.2</span></div>';
      html += '</div>';
      html += '<div class="note">Kedua komputer harus menggunakan IP Address yang berbeda, tetapi berada pada jaringan yang sama.</div>';
    } else if (index === 5) {
      html += '<div class="card-grid">';
      html += '<div class="card"><div class="label">Komputer 1</div><div class="ip">192.168.1.1</div><p>Subnet Mask<br><b>255.255.255.0</b></p></div>';
      html += '<div class="card"><div class="label">Komputer 2</div><div class="ip">192.168.1.2</div><p>Subnet Mask<br><b>255.255.255.0</b></p></div>';
      html += '</div><div class="note">Gateway dan DNS dapat dikosongkan karena jaringan digunakan untuk komunikasi langsung antar komputer.</div>';
    } else if (index === 7) {
      html += '<p><b>Dari Komputer 1</b></p><div class="code">ping 192.168.1.2</div><p>Jika muncul “Reply from 192.168.1.2”, koneksi berhasil.</p>';
      html += '<p><b>Dari Komputer 2</b></p><div class="code">ping 192.168.1.1</div><p>Jika mendapatkan reply, kedua komputer sudah saling terhubung.</p>';
    } else if (index === 9) {
      html += '<p><b>1. Buka Run</b><br>Tekan:</p><div class="code">Windows + R</div>';
      html += '<p><b>2. Masukkan alamat</b><br>Ketik:</p><div class="code">\\192.168.1.1</div>';
      html += '<p><b>3. Akses folder</b><br>Folder yang sudah dibagikan akan muncul dan dapat diakses sesuai izin.</p>';
    } else {
      // Use all extracted paragraphs, preserving wording.
      const paras = [];
      content.forEach(x => x.paragraphs.forEach(p => paras.push(p)));
      const unique = [...new Set(paras)].filter(Boolean);
      html += '<ul>' + unique.map(p => '<li>' + esc(p.replace(/^•\s*/, '')) + '</li>').join('') + '</ul>';
    }
    html += '</div>';
  }

  c.innerHTML = html;
  el.appendChild(c);

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.innerHTML = '<span>Jaringan Peer to Peer • Sharing Data</span><span>' + (index + 1) + '</span>';
  el.appendChild(footer);
  return el;
}

const presentation = document.getElementById('presentation');
sourceSlides.forEach((items, i) => presentation.appendChild(makeSlide(items, i)));

let current = 0;
const slideEls = [...document.querySelectorAll('.slide')];

function showSlide(n) {
  current = Math.max(0, Math.min(n, slideEls.length - 1));
  slideEls.forEach((s, i) => s.classList.toggle('active', i === current));
  document.getElementById('counter').textContent = `${current + 1} / ${slideEls.length}`;
  document.getElementById('progress').style.width = `${((current + 1) / slideEls.length) * 100}%`;
}
function nextSlide() { showSlide(current + 1); }
function prevSlide() { showSlide(current - 1); }

document.addEventListener('keydown', e => {
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); nextSlide(); }
  if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); prevSlide(); }
  if (e.key === 'Home') showSlide(0);
  if (e.key === 'End') showSlide(slideEls.length - 1);
  if (e.key.toLowerCase() === 'f') toggleFullscreen();
});

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
showSlide(0);
</script>
